name: Deploy App To GitHub Pages

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app build needs the vendor gitlinks under packages/app/vendor/.
      # Do not recurse the whole .gitmodules list. That also clones
      # references-submodules, which the frontend build does not use.
      - name: Checkout app vendor submodules
        run: |
          git submodule update --init --depth 1 -- \
            packages/app/vendor/headless-tree \
            packages/app/vendor/mastra \
            packages/app/vendor/novel \
            packages/app/vendor/polar \
            packages/app/vendor/presence \
            packages/app/vendor/r2 \
            packages/app/vendor/rate-limiter \
            packages/app/vendor/remix \
            packages/app/vendor/tiptap

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages serves this repo at /experiment--t3-chat/, not at the domain root.
      # Keep that base in CI only so local Vite still uses "/".
      # Use `pnpm exec vite build --base ...`. `pnpm run build -- --base` becomes
      # `vite build -- --base`, and Vite ignores the flag.
      - name: Build app
        working-directory: packages/app
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_CONVEX_HTTP_URL: ${{ vars.VITE_CONVEX_HTTP_URL }}
        run: pnpm exec vite build --base /experiment--t3-chat/

      - name: Add SPA fallback and nojekyll marker
        working-directory: packages/app
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
