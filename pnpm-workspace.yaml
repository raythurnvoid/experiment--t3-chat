packages:
  - "packages/*"
  # The council app is its own repository, mounted as a submodule. It carries its own lockfile and
  # its own tool versions, so the root workspace must not adopt it. On this machine the submodule
  # is cloned, so `packages/*` would otherwise find its package.json and demand a root lockfile
  # entry for it. CI never clones it, so the same lockfile would then not match CI's disk and
  # `pnpm install --frozen-lockfile` would fail there.
  - "!packages/council"
  - "packages/app/vendor/novel/packages/*"
  - "packages/app/vendor/headless-tree/packages/*"
  - "packages/app/vendor/remix/packages/*"
  - "packages/app/vendor/tiptap/packages/*"
  - "packages/app/vendor/tiptap/packages-deprecated/*"
  - "packages/app/vendor/mastra/packages/rag"
  - "packages/app/vendor/polar"
  - "packages/app/vendor/presence"
  - "packages/app/vendor/rate-limiter"
  - "packages/app/vendor/r2"
  - "packages/app/vendor/just-bash/packages/just-bash"

overrides:
  "@floating-ui/dom": "1.8.0"
  "@polar-sh/sdk": "0.49.0"
  "@tiptap/y-tiptap": "3.0.9"
  convex: "1.46.0"
  marked: "17.0.6"
  react: "19.3.0"
  react-dom: "19.3.0"
  yjs: "13.6.33"

onlyBuiltDependencies:
  - "@clerk/shared"
  - core-js
  - core-js-pure
  - esbuild
  - msw
