<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<script>
			// An MCP sign-in comes back as /oauth/mcp/callback?code=...&state=... Move that answer out of the
			// address bar before any other script runs, so Clerk, the app, and the browser history never keep
			// the code. The callback route reads it back. Keep the key equal to `CALLBACK_STORAGE_KEY` there.
			if (location.pathname.endsWith("/oauth/mcp/callback") && location.search) {
				sessionStorage.setItem("app::mcp_oauth::callback", location.search);
				history.replaceState(history.state, "", location.pathname);
			}
		</script>
		<script>
			// Set the theme class before the first paint, so the light theme never flashes dark. Keep the storage
			// key and the rule equal to `ThemeProvider` (src/components/theme-provider.tsx), which takes over later.
			try {
				const mode = localStorage.getItem("ai-chat-theme-mode");
				const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.add(dark ? "dark" : "light");
			} catch {
				// Storage can be blocked. The provider still sets the class after it mounts.
			}
		</script>
		<!-- GitHub Pages cannot set headers. Send only the origin, never a page path, to other sites. -->
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<link rel="icon" type="image/svg+xml" href="/press-logo.svg" />
		<link rel="apple-touch-icon" href="/press-logo.png" />
		<link rel="dns-prefetch" href="//%VITE_R2_FILES_DOWNLOAD_HOST%" />
		<link rel="preconnect" href="https://%VITE_R2_FILES_DOWNLOAD_HOST%" crossorigin />
		<!-- The Clerk hints are added by `main.tsx` for app pages only. The public share page never contacts Clerk. -->
		<!-- `viewport-fit=cover` lets the phone layout pad itself with `env(safe-area-inset-*)`.
		     `interactive-widget` makes the Android keyboard shrink the page, so the chat composer stays visible. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<!-- The chat surface color, `--color-base-1-02` in app.css, for the dark and the light theme.
		     `ThemeProvider` writes the chosen theme's color into both tags after it mounts. -->
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="oklch(0.18 0.014 60)" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="oklch(0.962 0.011 82)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>Bonobo Senate</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
