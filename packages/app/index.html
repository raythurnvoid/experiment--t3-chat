<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<script>
			// An MCP sign-in comes back as /oauth/mcp/callback?code=...&state=... Move that answer out of the
			// address bar before any other script runs, so Clerk, the app, and the browser history never keep
			// the code. The callback route reads it back. Keep the key equal to `CALLBACK_STORAGE_KEY` there.
			if (location.pathname.endsWith("/oauth/mcp/callback") && location.search) {
				sessionStorage.setItem("app::mcp_oauth::callback", location.search);
				history.replaceState(history.state, "", location.pathname);
			}
		</script>
		<!-- GitHub Pages cannot set headers. Send only the origin, never a page path, to other sites. -->
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<link rel="icon" type="image/svg+xml" href="/press-logo.svg" />
		<link rel="apple-touch-icon" href="/press-logo.png" />
		<link rel="dns-prefetch" href="//%VITE_R2_FILES_DOWNLOAD_HOST%" />
		<link rel="preconnect" href="https://%VITE_R2_FILES_DOWNLOAD_HOST%" crossorigin />
		<link rel="dns-prefetch" href="//%VITE_CLERK_FRONTEND_API_HOST%" />
		<link rel="preconnect" href="https://%VITE_CLERK_FRONTEND_API_HOST%" crossorigin />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Press</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
